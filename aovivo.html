<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ao Vivo — NOIR</title>
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07080b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Audiowide&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
  [hidden]{display:none!important}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#07080b;--bg-soft:#0a0b10;--panel:#101218;--panel-2:#14171f;
    --gold:#a855f7;--gold-hi:#c084fc;--gold-deep:#7c3aed;
    --text:#f4f5f8;--dim:#9aa0ae;--dimmer:#666c7a;
    --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.14);
    --live:#ff4d4d;--ease:cubic-bezier(.22,.9,.24,1);--header:68px;
  }
  body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-feature-settings:"ss01","cv11";background-image:linear-gradient(rgba(168,85,247,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(168,85,247,.05) 1px,transparent 1px);background-size:44px 44px;background-attachment:fixed}
  a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}svg{display:block;flex:none}img{display:block;max-width:100%}
  .wrap{width:min(1400px,100% - 48px);margin-inline:auto}
  header{position:fixed;inset:0 0 auto 0;z-index:90;background:rgba(7,8,11,.86);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border-bottom:1px solid var(--line)}
  .nav{display:flex;align-items:center;gap:14px;height:var(--header)}
  .logo{display:inline-flex;align-items:center;gap:10px;flex:none}
  .logo .mark{width:33px;height:33px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(150deg,var(--gold-hi),var(--gold-deep));box-shadow:0 6px 18px rgba(245,184,61,.3),inset 0 1px 0 rgba(255,255,255,.35)}
  .logo .mark svg{width:13px;height:13px;fill:#1a1204;margin-left:1px}
  .logo .txt{font-size:15.5px;font-weight:900;letter-spacing:-.03em;font-family:'Audiowide',sans-serif}
  .logo .txt b{color:var(--gold)}
  .back{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px 0 10px;border-radius:9px;border:1px solid var(--line);font-size:12px;font-weight:700;color:#a9aeba;transition:background .18s,color .18s,border-color .18s}
  .back:hover{background:rgba(255,255,255,.07);color:#fff;border-color:rgba(245,184,61,.4)}
  .back svg{width:13px;height:13px}
  .nav-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .nav-right a{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:9px;border:1px solid var(--line);font-size:12px;font-weight:700;color:#a9aeba;transition:background .18s,color .18s,border-color .18s}
  .nav-right a:hover{background:rgba(255,255,255,.07);color:#fff}
  .nav-right a.gold{border-color:transparent;color:#1a1204;background:linear-gradient(150deg,var(--gold-hi),var(--gold-deep));box-shadow:0 6px 18px rgba(245,184,61,.26),inset 0 1px 0 rgba(255,255,255,.4)}
  .nav-right a.gold:hover{filter:brightness(1.07);color:#1a1204}
  .nav-right svg{width:13px;height:13px}

  /* ───────── layout principal ───────── */
  .layout{display:grid;grid-template-columns:1fr 340px;gap:20px;padding:calc(var(--header)+24px) 0 40px;min-height:100vh}
  @media (max-width:980px){.layout{grid-template-columns:1fr}}

  /* ───────── player ───────── */
  .player-wrap{position:sticky;top:calc(var(--header)+16px);align-self:start}
  .player-box{position:relative;aspect-ratio:16/9;background:radial-gradient(circle at 50% 50%,#12101a,#000 70%);border-radius:14px;overflow:hidden;border:1px solid var(--line-2);box-shadow:0 20px 50px rgba(0,0,0,.6),0 0 0 1px rgba(168,85,247,.08),0 0 60px rgba(168,85,247,.06)}
  .player-box video{width:100%;height:100%;object-fit:contain;background:#000}
  .player-box .placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--dim);font-size:13px;font-weight:600;z-index:2;background:radial-gradient(circle at 50% 45%,rgba(168,85,247,.06),transparent 60%)}
  .player-box .placeholder svg{width:48px;height:48px;opacity:.3}
  .player-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(4,5,8,.78);backdrop-filter:blur(6px);color:var(--text);font-size:12.5px;font-weight:600;text-align:center;padding:20px}
  .player-msg .ring{width:34px;height:34px;border-radius:50%;border:2.5px solid rgba(255,255,255,.14);border-top-color:var(--gold-hi);animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .player-msg strong{display:block;font-size:13.5px;font-weight:800;margin-bottom:4px}
  .player-msg span{color:var(--dim);font-weight:600;line-height:1.6;max-width:34ch}
  .player-msg .retry{margin-top:4px}
  .player-info{margin-top:14px;padding:0 4px}
  .player-info h2{font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
  .player-info .meta{margin-top:6px;font-size:11.5px;font-weight:600;color:var(--dimmer);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .player-info .meta .live-dot{width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:0 0 8px rgba(255,77,77,.9);animation:beat 1.4s infinite}
  @keyframes beat{50%{opacity:.35;transform:scale(.85)}}
  .player-controls{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 14px;border-radius:9px;font-size:12px;font-weight:700;border:1px solid var(--line-2);background:rgba(255,255,255,.055);transition:background .18s,border-color .18s,filter .18s,transform .14s var(--ease)}
  .btn:hover{background:rgba(255,255,255,.11)} .btn:active{transform:scale(.975)}
  .btn svg{width:13px;height:13px}
  .btn-gold{background:linear-gradient(150deg,var(--gold-hi),var(--gold-deep));border-color:transparent;color:#1a1204;box-shadow:0 8px 22px rgba(245,184,61,.26),inset 0 1px 0 rgba(255,255,255,.4)}
  .btn-gold:hover{filter:brightness(1.08)}
  .btn-ghost{background:rgba(10,12,17,.5);border-color:rgba(255,255,255,.18)}
  .btn-ghost:hover{background:rgba(255,255,255,.14)}

  /* ───────── canais ───────── */
  .channels-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;max-height:calc(100vh - var(--header) - 40px)}
  .channels-header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .channels-header h3{font-size:13px;font-weight:800;letter-spacing:-.02em}
  .channels-search{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
  .channels-search svg{width:13px;height:13px;opacity:.4}
  .channels-search input{flex:1;min-width:0;font-size:12.5px;font-weight:600;outline:none;background:none}
  .channels-search input::placeholder{color:#4e5462}
  .channels-filters{display:flex;gap:4px;flex-wrap:wrap}
  .channels-filters button{height:26px;padding:0 10px;border-radius:999px;font-size:10.5px;font-weight:700;color:#aeb4c1;border:1px solid var(--line);background:rgba(255,255,255,.035);transition:all .15s}
  .channels-filters button:hover{color:#fff;background:rgba(168,85,247,.16);border-color:rgba(168,85,247,.35)}
  .channels-filters button.active{color:#1a1204;border-color:transparent;background:linear-gradient(150deg,var(--gold-hi),var(--gold-deep))}
  .channels-list{flex:1;overflow-y:auto;padding:6px}
  .channels-list::-webkit-scrollbar{width:6px}
  .channels-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
  .channel-item{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;transition:background .15s;border:1px solid transparent}
  .channel-item:hover{background:rgba(255,255,255,.05)}
  .channel-item.active{background:linear-gradient(100deg,rgba(168,85,247,.18),rgba(168,85,247,.05));border-color:rgba(168,85,247,.45);box-shadow:0 0 20px rgba(168,85,247,.1)}
  .channel-item img{width:32px;height:32px;object-fit:contain;border-radius:6px;background:rgba(255,255,255,.05)}
  .channel-item .info{min-width:0}
  .channel-item .info strong{display:block;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .channel-item .info span{display:block;margin-top:2px;font-size:9.5px;font-weight:600;color:var(--dimmer);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .channel-item .live{font-size:8px;font-weight:900;letter-spacing:.1em;color:#ffd7d7;border:1px solid rgba(255,61,61,.4);background:rgba(255,61,61,.12);border-radius:4px;padding:2px 5px}
  .channels-count{padding:8px 16px;border-top:1px solid var(--line);font-size:10.5px;font-weight:600;color:var(--dimmer)}
  .channels-empty{padding:30px 18px;text-align:center;color:var(--dimmer);font-size:12px;line-height:1.7}
  .channels-empty svg{width:40px;height:40px;margin:0 auto 12px;opacity:.3}
  .channels-empty strong{display:block;color:var(--text);font-size:13px;margin-bottom:6px}

  /* ───────── seções abaixo ───────── */
  .section{padding:40px 0}
  .section-head{display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
  .section-head h2{font-size:19px;font-weight:800;letter-spacing:-.028em}
  .section-head .count{margin-left:9px;font-size:11.5px;font-weight:700;color:var(--dimmer)}
  .channel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .channel-card{display:block;padding:14px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.025);transition:border-color .2s,transform .2s var(--ease),background .2s;cursor:pointer}
  .channel-card:hover{border-color:rgba(168,85,247,.5);transform:translateY(-3px);background:rgba(168,85,247,.08);box-shadow:0 12px 28px rgba(168,85,247,.16)}
  .channel-card .logo{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.06);margin-bottom:10px;overflow:hidden}
  .channel-card .logo img{width:100%;height:100%;object-fit:contain}
  .channel-card .logo span{font-size:11px;font-weight:900;color:#c3c8d3}
  .channel-card strong{display:block;font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .channel-card span{display:block;margin-top:3px;font-size:10px;font-weight:600;color:var(--dimmer);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ───────── rodapé ───────── */
  footer{margin-top:40px;border-top:1px solid var(--line);background:#05060a;padding:30px 0 24px;font-size:10.5px;line-height:1.8;color:#4e5462}
  @media (max-width:980px){
    .layout{grid-template-columns:1fr}
    .player-wrap{position:relative;top:0}
    .channels-panel{max-height:400px}
  }
  @media (max-width:680px){
    :root{--header:60px}
    .wrap{width:calc(100% - 28px)}
    .logo .txt{display:none}
    .nav-right a span{display:none}
    .channel-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a class="logo" href="index.html">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
      <span class="txt">NOIR</span>
    </a>
    <a class="back" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="m15 18-6-6 6-6"/></svg>
      Catálogo
    </a>
    <div class="nav-right">
      <a href="login.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Entrar</span>
      </a>
      <a class="gold" href="index.html#filmes">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <span>Catálogo</span>
      </a>
    </div>
  </div>
</header>

<div class="wrap layout">
  <!-- Player -->
  <div class="player-wrap">
    <div class="player-box" id="player-box">
      <video id="player" controls autoplay muted playsinline></video>
      <div class="placeholder" id="placeholder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m10 9.5 5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg>
        <span>Selecione um canal ao lado</span>
      </div>
      <div class="player-msg" id="player-msg" hidden></div>
    </div>
    <div class="player-info" id="player-info" hidden>
      <h2 id="chan-name">—</h2>
      <div class="meta">
        <span class="live-dot"></span>
        <span id="chan-group">Ao vivo</span>
        <span>·</span>
        <span id="chan-quality">HD</span>
      </div>
    </div>
    <div class="player-controls">
      <button class="btn btn-gold" id="btn-play">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Play
      </button>
      <button class="btn btn-ghost" id="btn-fullscreen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        Tela cheia
      </button>
      <button class="btn btn-ghost" id="btn-mute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
        Mudo
      </button>
    </div>
  </div>

  <!-- Canais -->
  <div class="channels-panel">
    <div class="channels-header">
      <h3>Canais ao vivo</h3>
      <div class="channels-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        <input type="text" id="chan-search" placeholder="Buscar canal..." autocomplete="off">
      </div>
      <div class="channels-filters" id="chan-filters"></div>
    </div>
    <div class="channels-list" id="chan-list"></div>
    <div class="channels-count" id="chan-count">Carregando...</div>
  </div>
</div>

<!-- Grade de canais -->
<div class="wrap">
  <section class="section">
    <div class="section-head">
      <h2>Canais em destaque</h2>
      <span class="count" id="grid-count"></span>
    </div>
    <div class="channel-grid" id="chan-grid"></div>
  </section>
</div>

<footer>
  <div class="wrap">
    NOIR — Canais ao vivo via IPTV. Conteúdo fornecido por terceiros. Marcas e logotipos pertencem aos seus respectivos detentores de direitos.
  </div>
</footer>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const player = $('player');
  const placeholder = $('placeholder');
  const playerInfo = $('player-info');
  const chanName = $('chan-name');
  const chanGroup = $('chan-group');
  const chanQuality = $('chan-quality');
  const chanSearch = $('chan-search');
  const chanFilters = $('chan-filters');
  const chanList = $('chan-list');
  const chanCount = $('chan-count');
  const chanGrid = $('chan-grid');
  const gridCount = $('grid-count');
  const playerMsg = $('player-msg');

  let channels = [];
  let currentChannel = null;
  let hls = null;
  let activeFilter = 'todos';

  // Carregar canais do JSON
  async function loadChannels() {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 45000);
    try {
      chanCount.textContent = 'Conectando ao servidor...';
      const r = await fetch('/api/iptv', { signal: ctrl.signal });
      clearTimeout(timer);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const data = await r.json();
      channels = data.channels || [];
      renderFilters(data.groups || []);
      renderChannelList(channels);
      renderGrid(channels.slice(0, 40));
      chanCount.textContent = `${channels.length} canais`;
      gridCount.textContent = `${channels.length} canais`;
      if (!channels.length) {
        chanList.innerHTML = '<div class="channels-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m10 9.5 5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg><strong>Nenhum canal disponível</strong>Configure IPTV_BASE, IPTV_USER e IPTV_PASS no servidor.</div>';
        chanGrid.innerHTML = '<div class="channels-empty" style="grid-column:1/-1"><strong>Nenhum canal para exibir</strong></div>';
      }
    } catch (e) {
      clearTimeout(timer);
      chanCount.textContent = 'Erro ao carregar';
      const msg = e.name === 'AbortError' ? 'Servidor demorou para responder. Tente recarregar a página.' : 'Erro: ' + e.message;
      chanList.innerHTML = '<div class="channels-empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m10 9.5 5 2.5-5 2.5z" fill="currentColor" stroke="none"/></svg><strong>Falha ao carregar</strong>' + msg + '</div>';
      console.error('Erro:', e);
    }
  }

  function renderFilters(groups) {
    chanFilters.innerHTML = '';
    const allBtn = document.createElement('button');
    allBtn.className = 'active';
    allBtn.textContent = 'Todos';
    allBtn.dataset.group = 'todos';
    allBtn.addEventListener('click', () => setFilter('todos'));
    chanFilters.appendChild(allBtn);

    // Show top groups first
    const topGroups = groups.slice(0, 12);
    topGroups.forEach(g => {
      const btn = document.createElement('button');
      btn.textContent = g;
      btn.dataset.group = g;
      btn.addEventListener('click', () => setFilter(g));
      chanFilters.appendChild(btn);
    });
  }

  function setFilter(group) {
    activeFilter = group;
    chanFilters.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.group === group);
    });
    filterChannels();
  }

  function filterChannels() {
    const term = chanSearch.value.trim().toLowerCase();
    let filtered = channels;
    if (activeFilter !== 'todos') {
      filtered = filtered.filter(c => c.group === activeFilter);
    }
    if (term) {
      filtered = filtered.filter(c => c.name.toLowerCase().includes(term));
    }
    renderChannelList(filtered);
    chanCount.textContent = `${filtered.length} canais`;
  }

  function renderChannelList(list) {
    chanList.innerHTML = '';
    list.slice(0, 200).forEach(ch => {
      const item = document.createElement('div');
      item.className = 'channel-item' + (currentChannel && currentChannel.name === ch.name ? ' active' : '');
      item.innerHTML = `
        <img src="${esc(ch.logo)}" alt="" onerror="this.style.display='none'">
        <div class="info">
          <strong>${esc(ch.name)}</strong>
          <span>${esc(ch.group)}</span>
        </div>
        <span class="live">AO VIVO</span>`;
      item.addEventListener('click', () => playChannel(ch));
      chanList.appendChild(item);
    });
  }

  function renderGrid(list) {
    chanGrid.innerHTML = '';
    list.forEach(ch => {
      const card = document.createElement('div');
      card.className = 'channel-card';
      card.innerHTML = `
        <div class="logo">
          ${ch.logo ? `<img src="${esc(ch.logo)}" alt="" onerror="this.parentElement.innerHTML='<span>${esc(ch.name.slice(0,3))}</span>'">` : `<span>${esc(ch.name.slice(0,3))}</span>`}
        </div>
        <strong>${esc(ch.name)}</strong>
        <span>${esc(ch.group)}</span>`;
      card.addEventListener('click', () => playChannel(ch));
      chanGrid.appendChild(card);
    });
  }

  function msg(estado, titulo, detalhe, comRetry) {
    if (estado === 'oculto') { playerMsg.hidden = true; playerMsg.innerHTML = ''; return; }
    playerMsg.hidden = false;
    playerMsg.innerHTML = estado === 'carregando'
      ? `<div class="ring"></div><span>${esc(titulo)}</span>`
      : `<strong>${esc(titulo)}</strong><span>${esc(detalhe || '')}</span>${comRetry ? '<button class="btn btn-ghost retry" id="msg-retry">Tentar de novo</button>' : ''}`;
    const b = document.getElementById('msg-retry');
    if (b) b.addEventListener('click', () => { if (currentChannel) playChannel(currentChannel); });
  }

  function playChannel(ch) {
    currentChannel = ch;
    placeholder.hidden = true;
    playerInfo.hidden = false;
    chanName.textContent = ch.name;
    chanGroup.textContent = ch.group;
    chanQuality.textContent = ch.name.includes('FHD') ? 'FHD' : ch.name.includes('HD') ? 'HD' : 'SD';

    chanList.querySelectorAll('.channel-item').forEach(item => {
      item.classList.toggle('active', item.querySelector('strong')?.textContent === ch.name);
    });

    if (hls) { hls.destroy(); hls = null; }
    player.removeAttribute('src');
    player.load();
    msg('carregando', 'Conectando ao canal...');

    const url = ch.url;
    let tentativas = 0;

    if (Hls.isSupported()) {
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true,
        backBufferLength: 90,
        manifestLoadingTimeOut: 15000,
        manifestLoadingMaxRetry: 2,
        levelLoadingTimeOut: 15000,
        fragLoadingTimeOut: 20000,
      });
      hls.loadSource(url);
      hls.attachMedia(player);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        msg('oculto');
        player.play().catch(() => {});
      });
      hls.on(Hls.Events.FRAG_BUFFERED, () => msg('oculto'));
      hls.on(Hls.Events.ERROR, (event, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.MEDIA_ERROR) { hls.recoverMediaError(); return; }
        tentativas += 1;
        if (tentativas <= 2) {
          msg('carregando', `Reconectando... (${tentativas}/2)`);
          setTimeout(() => { if (hls) { hls.destroy(); hls = null; playChannel(ch); } }, 1200 * tentativas);
          return;
        }
        hls.destroy(); hls = null;
        msg('erro', 'Canal indisponível', 'O provedor bloqueia reprodução fora do Brasil. Use o app NOIR ou o servidor local (192.168.1.104) para assistir.', true);
      });
    } else if (player.canPlayType('application/vnd.apple.mpegurl')) {
      player.src = url;
      player.addEventListener('loadedmetadata', () => { msg('oculto'); player.play().catch(() => {}); }, { once: true });
      player.addEventListener('error', () => msg('erro', 'Canal indisponível', 'Tente outro canal.', true), { once: true });
    } else {
      player.src = url;
      player.play().catch(() => {});
      msg('oculto');
    }
  }

  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  // Event listeners
  chanSearch.addEventListener('input', () => filterChannels());

  $('btn-play').addEventListener('click', () => {
    if (player.paused) player.play(); else player.pause();
  });

  $('btn-fullscreen').addEventListener('click', () => {
    if (player.requestFullscreen) player.requestFullscreen();
    else if (player.webkitRequestFullscreen) player.webkitRequestFullscreen();
  });

  $('btn-mute').addEventListener('click', () => {
    player.muted = !player.muted;
    $('btn-mute').innerHTML = player.muted
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M22 9l-6 6M16 9l6 6"/></svg> Mudo'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg> Som';
  });

  // Load channels on page load
  loadChannels();
})();
</script>
</body>
