<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOIR - Offline</title>
  <style>
    body { 
      background: #07080b; 
      color: #f4f5f8; 
      font-family: 'Inter', sans-serif; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      margin: 0;
    }
    .error-box {
      background: #101218;
      padding: 40px;
      border-radius: 12px;
      text-align: center;
      max-width: 400px;
      margin: 20px;
    }
    .error-box h1 { color: #a855f7; font-size: 48px; margin-bottom: 10px; }
    .error-box p { color: #9aa0ae; margin-bottom: 20px; }
    .error-box a {
      color: #fff;
      text-decoration: none;
      background: #a855f7;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="error-box">
    <h1>📡 Sem conexão</h1>
    <p>Não foi possível carregar o site. Verifique sua conexão e tente novamente.</p>
    <a href="/index.html">Tentar novamente</a>
  </div>
</body>
</html>
